# deepseek-harness-quota-monitor bundle patch layer.
# Rows here are referenced by package name; the loader resolves them from the
# profile's node_modules (installed via `dsh plugin --profile web add .`).
#
# All behaviour lives in the `quota-monitor` settings namespace (Plugins page
# -> 额度监控): providers, usage-API urls, credential references, JS parsers,
# windows, thresholds. The schema is declared by the exported `Config` and its
# defaults apply when nothing is set.
#
# This bundle inserts the row only. User configuration belongs in the active
# profile's patch file (written by the configuration page); a profile adding
# `config:` to this row must do so from its own cordis.patch.yml layer.
- insert:
  - id: quota-monitor
    name: deepseek-harness-quota-monitor
